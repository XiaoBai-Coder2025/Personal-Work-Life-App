<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人工作生活</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>个人工作生活</h1>
    <span id="today-label" class="muted"></span>
  </header>
  <nav id="nav" class="nav"></nav>
  <main id="view" class="view"></main>
  <div class="dock">
    <div id="dock-answer" class="dockanswer" hidden></div>
    <div class="row">
      <span class="dockmark">AI</span>
      <input id="dock-input" type="text" placeholder="问点什么">
      <button id="dock-send" class="primary">发送</button>
      <a class="docklink" href="#/ai">展开</a>
    </div>
    <div id="dock-quick" class="row"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
