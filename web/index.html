<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>个人工作生活</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">我的工作生活</div>
      <nav id="sidenav"></nav>
      <div class="sidetip">数据存在本机<br>断网也能用</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">首页总览</h1>
          <div id="today-label" class="muted small"></div>
        </div>
        <div class="topright">
          <span id="weather" class="chip"></span>
          <span id="appearance" class="seg"></span>
          <span id="theme-tag" class="chip"></span>
        </div>
      </header>
      <main id="view" class="view"></main>
      <div class="dock">
        <div id="dock-answer" class="dockanswer" hidden></div>
        <div class="row">
          <span class="dockmark">AI</span>
          <input id="dock-input" type="text" placeholder="问点什么">
          <button id="dock-send" class="primary">发送</button>
          <a class="docklink" href="#/ai">展开</a>
        </div>
        <div id="dock-quick" class="row"></div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
